

defaults:
  - dataset: batch_invariance_constraint
  - env: lmaze
  - model: poly_flow_oneray
  - default
  - _self_  


env_name: "lmaze"
algo_name: "oneray"
run_name: "train" # current run
seed: 42
device: "cuda:4"

x_dim: 2
num_cons: 4
num_rays: 1
max_seq: 50
steps: 10 

file_path: "data/L_maze_traj_data.npz"


sample:
  method: "discrete" # discrete, flow, diffusion
  steps: ${steps}
  device: ${device}
  projection: "none"



train:
  method: "discrete" # discrete, flow, diffusion
  iteration: 100000 # training steps
  lr: 1e-4
  batch_size: 50
  steps: ${steps}        
  eval_freq: 1000
  log_freq: 100
  save_freq: 10000
  use_ot: true
  use_one_ray: true
  device: ${device}
  seed: ${seed}

eval:
  eval_samples: 100
  plot_ellips: false
  max_plot_traj: 5



