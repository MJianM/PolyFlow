defaults:
  - default
  - dataset: sequence
  - backbone: unet
  - algorithm: diffusion
  - env: hopper
  - _self_

env:
  use_cpx: ${use_cpx}
  vel_scale: ${vel_scale}  
  height_limit: ${height_limit}
  height_min: ${height_min}
  v_max: ${v_max}
  v_min: ${v_min}

algorithm:
  env_name: "hopper_cpx2"
  safe_method: "RoS"
  height_limit: ${height_limit}
  vel_scale: ${vel_scale}
  height_min: ${height_min}
  v_max: ${v_max}
  v_min: ${v_min}
  obs_vel_idx: 6
  
# 不加 guide policy config
policy:
  _target_: src.sampling.policies.GuidedPolicy
  preprocess_fns: []

val_dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: ${eval.samples}
  shuffle: true

eval:
  load_model_path: ??
  samples: 200   # 计算分布差异时，采样多少个horizon
  # rollout
  n_episodes: 10  # rollout 多少条轨迹
  seed: ${seed}
  is_video: true
  video_episodes: 2

  check_index_list: [0, 1, 2, 3, 4] # 在计算平滑度时考虑哪些维度


env_name: hoppercpx2
algo_name: RoS
run_name: sample


device: "cuda:0"
seed: 42
dataset_minari_name: "mujoco/hopper/medium-v0"
horizon: 600  # 如果要使用 unet 要保证 horizon 能够被8整除
max_seq: 1000
obs_dim: 11
act_dim: 3
transition_dim: 14
cond_dim: 11
steps: 20  # diffusion 扩散步

height_limit: 1.5
vel_scale: 0.01
height_min: 0.8
v_max: 2.5
v_min: -2.5
use_cpx: 2


