defaults:
  - default
  - dataset: sequence
  - backbone: unet
  - algorithm: diffusion
  - env: halfcheetah
  - _self_

backbone:
  dim: 64

algorithm:
  env_name: "halfcheetah"
  safe_method: "RoS"
  leg_limit: ${leg_limit}
  torsion_limit: ${torsion_limit}
  
# 不加 guide policy config
policy:
  _target_: src.sampling.policies.GuidedPolicy
  preprocess_fns: []

val_dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: ${eval.samples}
  shuffle: true

eval:
  load_model_path: "outputs/halfcheetah/diffusion_train_horizon160/42_2026-01-08_14-39-01/state_final.pt"
  samples: 200   # 计算分布差异时，采样多少个horizon
  # rollout
  n_episodes: 10  # rollout 多少条轨迹
  seed: ${seed}
  is_video: true
  video_episodes: 2
  skip_rollout: true

  # check_index_list: [0, 1, 2, 3, 4, 5, 6, 7] # 在计算平滑度时考虑哪些维度


env_name: halfcheetah
algo_name: RoS
run_name: time_horizon160


device: "cuda:0"
seed: 42
dataset_minari_name: "mujoco/halfcheetah/medium-v0"
horizon: 160  # 如果要使用 unet 要保证 horizon 能够被8整除
max_seq: 1000
obs_dim: 17
act_dim: 6
transition_dim: 23
cond_dim: 17
steps: 20  # diffusion 扩散步

leg_limit: 1.2
torsion_limit: 0.8


