defaults:
  - sample_flow_walkercpx2
  - _self_

algorithm:
  _target_: src.models.flow.SafeFlowMathcing
  horizon: ${horizon}
  observation_dim: ${obs_dim}
  action_dim: ${act_dim}
  n_timesteps: ${steps}
  loss_type: 'l2'
  action_weight: 10
  loss_discount: 1.0
  loss_weights: null
  env_name: "walker2d_cpx2"
  safe_method: "safeflow"
  height_limit: ${height_limit}
  vel_scale: ${vel_scale}
  obs_vel_idx: 9
  height_min: ${height_min}
  v_max: ${v_max}
  v_min: ${v_min}

env_name: walker2dcpx2
algo_name: safeflow
run_name: sample_step100

device: "cuda:0"
seed: 42

height_limit: 1.35
vel_scale: 0.01
height_min: 0.9
v_max: 1.4
v_min: -1.4
use_cpx: 2
steps: 100

