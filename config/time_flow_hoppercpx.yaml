defaults:
  - default
  - dataset: sequence
  - backbone: dit
  - algorithm: flow
  - env: hopper
  - _self_

dataset:
  use_padding: false

env:
  use_cpx: ${use_cpx}
  vel_scale: ${vel_scale}
  height_limit: ${height_limit}
  
# 不加 guide policy config
policy:
  _target_: src.sampling.policies.GuidedPolicy
  preprocess_fns: []

val_dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: ${eval.samples}
  shuffle: true

eval:
  load_model_path: "outputs/hopper/flow_train/42_2026-01-06_20-43-12/state_final.pt"
  samples: 200   # 计算分布差异时，采样多少个horizon
  # rollout
  n_episodes: 10  # rollout 多少条轨迹
  seed: ${seed}
  is_video: true
  video_episodes: 2
  skip_rollout: true

  check_index_list: [0, 1, 2, 3, 4] # 在计算平滑度时考虑哪些维度


env_name: hoppercpx
algo_name: flow
run_name: time_step200


device: "cuda:0"
seed: 42
dataset_minari_name: "mujoco/hopper/medium-v0"
horizon: 100  # 如果要使用 unet 要保证 horizon 能够被8整除
max_seq: 1000
obs_dim: 11
act_dim: 3
transition_dim: 14
cond_dim: 11
steps: 200  # 采样步数


height_limit: 1.6
vel_scale: 0.01
use_cpx: 1