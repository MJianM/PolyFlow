

defaults:
  - dataset: box_constraint
  - env: maze2d
  - model: poly_flow_oneray
  - default
  - _self_  # 允许主配置覆盖默认值

# 实验名称 (用于文件夹命名)
env_name: "maze2d"
algo_name: "oneray"
run_name: "sample" # 这次实验的名字
seed: 42
device: "cuda:0"

x_dim: 2
num_cons: 4
num_rays: 1
max_seq: 300
steps: 10 # 离散步数

file_path: "data/large_maze_traj_data_expand_02.npz"

# 采样参数
sample:
  method: "discrete" # discrete, flow, diffusion
  load_model_path: "outputs/maze2d/oneray_train/42_2025-12-24_14-50-35/model_final.pt"
  steps: ${steps}
  device: ${device}
  projection: "none"


eval:
  eval_samples: 200
  plot_ellips: false
  max_plot_traj: 5



