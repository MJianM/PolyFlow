defaults:
  - time_polyflow_halfcheetah
  - _self_

backbone:
  cons_begin_seq_idx: 0
  share_traj_encoder: true
  time_invariance_cons: true
  ray_shooting_method: 'boltzmann'
  ray_shooting_beta: 80

eval:
  load_model_path: "outputs/halfcheetah/polyflow_train_boltzmann80/42_2026-01-12_19-56-07/state_final.pt"
  load_ema: false
  samples: 200   # 计算分布差异时，采样多少个horizon
  # rollout
  n_episodes: 10  # rollout 多少条轨迹
  seed: ${seed}
  is_video: true
  video_episodes: 2
  skip_rollout: true

env_name: halfcheetah
algo_name: polyflow
run_name: time_boltzmann80

device: "cuda:0"
seed: 42

steps: 10  # 采样步数