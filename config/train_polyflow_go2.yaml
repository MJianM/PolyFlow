defaults:
  - default
  - backbone: go2_poly
  - algorithm: go2_discrete_flow
  - dataset: sequence_go2
  - _self_



algorithm:
  action_weight: 10.0
  loss_discount: 0.99

trainer:
  _target_: src.utils.training.Go2Trainer
  # diffusion_model: ??
  # dataset: ??
  # renderer: null
  device: ${device}
  ema_decay: 0.995
  train_batch_size: 64
  train_lr: 1e-4
  gradient_accumulate_every: 1
  step_start_ema: 2000
  update_ema_every: 100
  log_freq: 200
  save_freq: 100000
  label_freq: ${trainer.save_freq}
  save_parallel: false
  
# 不加 guide policy config
policy:
  _target_: src.sampling.policies.Go2PolyFlowPolicy
  # diffusion_model: null
  # normalizer: null
  preprocess_fns: []


val_dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: ${eval.samples}
  shuffle: true

eval:
  samples: 200   # 计算分布差异时，采样多少个horizon
  # # rollout
  # n_episodes: 10  # rollout 多少条轨迹
  # seed: ${seed}
  # is_video: true
  # video_episodes: 2

  # check_index_list: [0, 1, 2, 3, 4, 5, 6, 7] # 在计算平滑度时考虑哪些维度



env_name: go2
algo_name: polyflow
run_name: train


device: "cuda:3"
seed: 42

file_path: 'data/bound_go2_traj_data.npz'

horizon: 50  # 如果要使用 unet 要保证 horizon 能够被8整除
max_seq: 1000
obs_dim: 49
act_dim: 12
transition_dim: 61
cond_dim: 61
steps: 10  # 采样步数

iteration: 1000000  # 训练step





