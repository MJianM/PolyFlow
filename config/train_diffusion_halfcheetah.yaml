defaults:
  - default
  - dataset: sequence
  - backbone: unet
  - algorithm: diffusion
  - env: halfcheetah
  - _self_

backbone:
  dim: 64

trainer:
  _target_: src.utils.training.Trainer
  # diffusion_model: ??
  # dataset: ??
  # renderer: null
  device: ${device}
  ema_decay: 0.995
  train_batch_size: 32
  train_lr: 2e-4
  gradient_accumulate_every: 2
  step_start_ema: 2000
  update_ema_every: 10
  log_freq: 500
  save_freq: 200000
  label_freq: ${trainer.save_freq}
  save_parallel: false
  
# 不加 guide policy config
policy:
  _target_: src.sampling.policies.GuidedPolicy
  # diffusion_model: null
  # normalizer: null
  preprocess_fns: []
  # sampling kwargs
  # sample_fn: src.sampling.functions.n_step_guided_p_sample
  # n_guide_steps: 2
  # t_stopgrad: 2
  # scale_grad_by_std: true

val_dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: ${eval.samples}
  shuffle: true

eval:
  samples: 200   # 计算分布差异时，采样多少个horizon
  # rollout
  n_episodes: 10  # rollout 多少条轨迹
  seed: ${seed}
  is_video: true
  video_episodes: 2



env_name: halfcheetah
algo_name: diffusion
run_name: train_horizon160


device: "cuda:4"
seed: 42
dataset_minari_name: "mujoco/halfcheetah/medium-v0"
horizon: 160  # 如果要使用 unet 要保证 horizon 能够被8整除
max_seq: 1000
obs_dim: 17
act_dim: 6
transition_dim: 23
cond_dim: 17
steps: 20  # diffusion 扩散步

iteration: 1000000  # 训练step

leg_limit: 1.2
torsion_limit: 0.8



