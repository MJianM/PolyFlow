

defaults:
  - dataset: box_constraint
  - env: maze2d
  - model: dit
  - default
  - _self_  # 允许主配置覆盖默认值

# 实验名称 (用于文件夹命名)
env_name: "maze2d"
algo_name: "safeflow"
run_name: "sample" # 这次实验的名字
seed: 42
device: "cuda:0"

x_dim: 2
num_cons: 4
max_seq: 300
steps: 500 # 没有用

file_path: "data/large_maze_traj_data_expand_02.npz"

# 采样参数
sample:
  method: "safeflow" # discrete, flow, diffusion, safeflow
  load_model_path: "outputs/maze2d/flow_test/42_2025-12-23_22-32-36/model_iter_50.pt"
  steps: ${steps}
  device: ${device}
  projection: "none"

eval:
  eval_samples: 100
  plot_ellips: true
  max_plot_traj: 5



