

defaults:
  - dataset: box_constraint
  - env: maze2d
  - model: dit
  - default
  - _self_  


env_name: "maze2d"
algo_name: "safeflow"
run_name: "sample" # current run
seed: 42
device: "cuda:0"

x_dim: 2
num_cons: 4
max_seq: 300
steps: 200 # 

file_path: "data/large_maze_traj_data_expand_02.npz"


sample:
  method: "safeflow" # discrete, flow, diffusion, safeflow
  load_model_path: "outputs/maze2d/flow_train/42_2025-12-24_14-50-13/model_final.pt"
  steps: ${steps}
  device: ${device}
  projection: "none"
  clip_grad: 0.5
  clip_u: 10
  slack_penalty: 1.0

eval:
  eval_samples: 200
  plot_ellips: true
  max_plot_traj: 5



